name: gym_crm
description: GymCRM - Gym Management App
publish_to: 'none'
version: 1.0.0+19

environment:
  sdk: ^3.10.7

dependencies:
  flutter:
    sdk: flutter

  # Supabase
  supabase_flutter: ^2.8.4

  # State management
  flutter_riverpod: ^2.6.1

  # Navigation
  go_router: ^14.8.1

  # UI — Manrope is bundled as a static font asset (see flutter: fonts below),
  # so we no longer fetch it at runtime via google_fonts.
  cached_network_image: ^3.4.1
  shimmer: ^3.0.0

  # QR code scanning & generation
  mobile_scanner: ^5.2.3
  qr_flutter: ^4.1.0

  # Charts
  fl_chart: ^0.69.2

  # Utils
  intl: ^0.19.0
  image_picker: ^1.1.2
  file_picker: ^8.1.6
  url_launcher: ^6.3.1
  http: ^1.2.2
  share_plus: ^10.1.4
  path_provider: ^2.1.5
  permission_handler: ^11.3.1
  shared_preferences: ^2.3.3

  cupertino_icons: ^1.0.8

  # Error monitoring
  sentry_flutter: ^9.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3
  flutter_native_splash: ^2.4.4

flutter_launcher_icons:
  android: true
  ios: true
  remove_alpha_ios: true
  image_path: "assets/icon/app_icon.png"
  min_sdk_android: 21
  adaptive_icon_background: "#0d1b2e"
  adaptive_icon_foreground: "assets/icon/app_icon.png"

# Native splash shown during cold start (engine init + session restore), so the
# user sees branding instead of a blank white screen. Regenerate after changes:
#   dart run flutter_native_splash:create
flutter_native_splash:
  color: "#0d1b2e"
  image: assets/icon/app_icon.png
  android_12:
    color: "#0d1b2e"
    image: assets/icon/app_icon.png
  android: true
  ios: true

flutter:
  uses-material-design: true
  assets:
    - shorebird.yaml
  fonts:
    - family: Manrope
      fonts:
        - asset: assets/fonts/Manrope_400Regular.ttf
          weight: 400
        - asset: assets/fonts/Manrope_500Medium.ttf
          weight: 500
        - asset: assets/fonts/Manrope_600SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Manrope_700Bold.ttf
          weight: 700
        - asset: assets/fonts/Manrope_800ExtraBold.ttf
          weight: 800
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter_400Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter_500Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter_600SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter_700Bold.ttf
          weight: 700
        - asset: assets/fonts/Inter_800ExtraBold.ttf
          weight: 800
