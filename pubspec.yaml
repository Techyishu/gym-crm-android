name: gym_crm
description: GymCRM - Gym Management App
publish_to: 'none'
version: 1.0.1+44

environment:
  sdk: ^3.10.7

dependencies:
  flutter:
    sdk: flutter

  # Supabase
  supabase_flutter: ^2.8.4

  # State management
  flutter_riverpod: ^2.6.1

  # Navigation
  go_router: ^14.8.1

  # UI — Manrope is bundled as a static font asset (see flutter: fonts below),
  # so we no longer fetch it at runtime via google_fonts.
  cached_network_image: ^3.4.1
  shimmer: ^3.0.0
  flutter_svg: ^2.0.10+1

  # QR code scanning & generation
  mobile_scanner: ^7.2.0
  qr_flutter: ^4.1.0

  # Charts
  fl_chart: ^0.69.2

  # Guided tour tooltips (coach marks)
  showcaseview: ^5.1.0

  # Utils
  intl: ^0.19.0
  country_picker: ^2.0.27
  currency_picker: ^2.0.21
  image_picker: ^1.1.2
  file_picker: ^8.1.6
  url_launcher: ^6.3.1
  in_app_review: ^2.0.10
  in_app_update: ^4.2.3
  facebook_app_events: ^0.19.3
  http: ^1.2.2
  app_links: ^6.3.2
  share_plus: ^10.1.4
  gal: ^2.3.0
  path_provider: ^2.1.5
  pdf: ^3.11.1
  printing: ^5.13.2
  shared_preferences: ^2.3.3

  # Mobile OTP login (Android only) — MSG91
  sendotp_flutter_sdk: ^0.0.2

  cupertino_icons: ^1.0.8

  # Error monitoring
  sentry_flutter: ^9.0.0

  # In-App Purchase (iOS only — RevenueCat)
  # 9.x is required by Google Play: it pulls purchases-hybrid-common 17.x, which
  # builds against Play Billing Library 8. The 8.x line was stuck on Billing 7,
  # rejected for uploads from 2026-08-31.
  purchases_flutter: ^9.10.7
  purchases_ui_flutter: ^9.10.7

  # Push notifications
  onesignal_flutter: ^5.3.3
  firebase_core: ^4.12.1
  firebase_analytics: ^12.4.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3
  flutter_native_splash: ^2.4.4

flutter_launcher_icons:
  android: true
  ios: true
  remove_alpha_ios: true
  image_path: "assets/icon/app_icon.png"
  min_sdk_android: 21
  adaptive_icon_background: "#0d1b2e"
  adaptive_icon_foreground: "assets/icon/app_icon.png"

# Native splash shown during cold start (engine init + session restore), so the
# user sees branding instead of a blank white screen. Regenerate after changes:
#   dart run flutter_native_splash:create
flutter_native_splash:
  color: "#0d1b2e"
  image: assets/icon/app_icon.png
  android_12:
    color: "#0d1b2e"
    image: assets/icon/app_icon.png
  android: true
  ios: true

flutter:
  uses-material-design: true
  assets:
    - shorebird.yaml
    - assets/icons/
  fonts:
    - family: Manrope
      fonts:
        - asset: assets/fonts/Manrope_400Regular.ttf
          weight: 400
        - asset: assets/fonts/Manrope_500Medium.ttf
          weight: 500
        - asset: assets/fonts/Manrope_600SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Manrope_700Bold.ttf
          weight: 700
        - asset: assets/fonts/Manrope_800ExtraBold.ttf
          weight: 800
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter_400Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter_500Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter_600SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter_700Bold.ttf
          weight: 700
        - asset: assets/fonts/Inter_800ExtraBold.ttf
          weight: 800
